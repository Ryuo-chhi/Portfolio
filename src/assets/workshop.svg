<svg
  viewBox="0 0 720 440"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Background / Wall -->
  <rect width="720" height="440" fill="transparent" />

  <!-- Window -->
  <g>
    <!-- Frame Outer -->
    <rect x="420" y="40" width="220" height="160" rx="8" fill="var(--color-bark)" stroke="var(--color-ink)" stroke-width="4" />
    <!-- Glass -->
    <rect x="428" y="48" width="204" height="144" rx="4" fill="var(--color-sky)" stroke="var(--color-ink)" stroke-width="3" />
    
    <g style="clip-path: url(#window-clip)">
      <!-- Mountains -->
      <path d="M400 192 L470 120 L550 192 Z" fill="var(--color-sage-soft)" stroke="var(--color-ink)" stroke-width="2" stroke-linejoin="round" />
      <path d="M470 120 L505 155 L435 155 Z" fill="var(--color-cream)" stroke="var(--color-ink)" stroke-width="2" stroke-linejoin="round" />
      
      <path d="M510 192 L580 90 L650 192 Z" fill="var(--color-sage)" stroke="var(--color-ink)" stroke-width="2" stroke-linejoin="round" />
      <path d="M580 90 L615 140 L545 140 Z" fill="var(--color-cream)" stroke="var(--color-ink)" stroke-width="2" stroke-linejoin="round" />
      
      <!-- Clouds -->
      <path class="anim-drift-slow" d="M450 80 Q460 70 470 80 Q485 75 495 85 Q500 95 490 100 H440 Q430 90 450 80 Z" fill="var(--color-cream)" opacity="0.8" />
      <path class="anim-drift-fast" d="M550 110 Q560 100 570 110 Q585 105 595 115 Q600 125 590 130 H540 Q530 120 550 110 Z" fill="var(--color-cream)" opacity="0.6" />
      
      <!-- Bird -->
      <g class="anim-flyby">
        <path class="anim-flap" d="M0 0 Q 5 -5 10 0 Q 5 5 0 0 M10 0 Q 15 -5 20 0 Q 15 5 10 0" fill="none" stroke="var(--color-ink)" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>

    <!-- Window Sill -->
    <rect x="410" y="196" width="240" height="12" rx="4" fill="var(--color-bark-light)" stroke="var(--color-ink)" stroke-width="4" />
  </g>

  <!-- Shelf -->
  <g>
    <rect x="60" y="80" width="260" height="12" rx="4" fill="var(--color-bark)" stroke="var(--color-ink)" stroke-width="4" />
    <!-- Boxes on shelf -->
    <rect x="80" y="50" width="40" height="30" rx="2" fill="var(--color-ember)" stroke="var(--color-ink)" stroke-width="3" stroke-linejoin="round" />
    <rect x="130" y="40" width="20" height="40" rx="2" fill="var(--color-sage)" stroke="var(--color-ink)" stroke-width="3" stroke-linejoin="round" />
    <rect x="160" y="60" width="50" height="20" rx="2" fill="var(--color-sky)" stroke="var(--color-ink)" stroke-width="3" stroke-linejoin="round" />
    <!-- Books -->
    <rect x="230" y="30" width="14" height="50" rx="2" fill="var(--color-forest)" stroke="var(--color-ink)" stroke-width="3" stroke-linejoin="round" transform="rotate(10 230 80)" />
    <rect x="250" y="30" width="14" height="50" rx="2" fill="var(--color-sage-soft)" stroke="var(--color-ink)" stroke-width="3" stroke-linejoin="round" transform="rotate(15 250 80)" />
  </g>

  <!-- Hanging Plant -->
  <g class="anim-sway" style="transform-origin: 330px -10px;">
    <path d="M330 -10 V60" stroke="var(--color-ink)" stroke-width="2" />
    <path d="M310 60 Q330 90 350 60 Z" fill="var(--color-forest)" stroke="var(--color-ink)" stroke-width="3" stroke-linejoin="round" />
    <!-- Hanging leaves -->
    <path d="M315 65 Q310 90 320 110" fill="none" stroke="var(--color-sage)" stroke-width="4" stroke-linecap="round" />
    <path d="M345 65 Q350 80 340 100" fill="none" stroke="var(--color-sage)" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Pinned Notes -->
  <g>
    <rect x="70" y="140" width="40" height="40" fill="var(--color-ember-soft)" stroke="var(--color-ink)" stroke-width="2" transform="rotate(-5 90 160)" />
    <circle cx="85" cy="145" r="3" fill="var(--color-pin-head)" stroke="var(--color-pin-edge)" stroke-width="1.5" />
    
    <rect x="130" y="150" width="45" height="35" fill="var(--color-sky)" stroke="var(--color-ink)" stroke-width="2" transform="rotate(8 152 167)" />
    <circle cx="152" cy="155" r="3" fill="var(--color-pin-head)" stroke="var(--color-pin-edge)" stroke-width="1.5" />
  </g>

  <!-- Desk -->
  <g>
    <!-- Desk Legs -->
    <rect x="100" y="280" width="16" height="160" fill="var(--color-bark-light)" stroke="var(--color-ink)" stroke-width="4" />
    <rect x="600" y="280" width="16" height="160" fill="var(--color-bark-light)" stroke="var(--color-ink)" stroke-width="4" />
    <!-- Desk Top -->
    <rect x="40" y="260" width="640" height="20" rx="4" fill="var(--color-bark)" stroke="var(--color-ink)" stroke-width="4" />
  </g>

  <!-- Monitor 1 (Main) -->
  <g>
    <!-- Stand -->
    <path d="M260 260 L240 210 H320 L300 260 Z" fill="var(--color-ink-soft)" stroke="var(--color-ink)" stroke-width="3" stroke-linejoin="round" />
    <rect x="220" y="254" width="120" height="6" rx="2" fill="var(--color-ink)" />
    <!-- Screen -->
    <rect x="140" y="100" width="240" height="140" rx="8" fill="var(--color-ink)" stroke="var(--color-ink)" stroke-width="4" />
    <!-- Code -->
    <rect x="150" y="110" width="150" height="8" rx="4" fill="var(--color-sage)" />
    <rect x="150" y="126" width="100" height="8" rx="4" fill="var(--color-sky)" />
    <rect x="160" y="142" width="180" height="8" rx="4" fill="var(--color-ember)" />
    <rect x="160" y="158" width="120" height="8" rx="4" fill="var(--color-cream)" opacity="0.6" />
    <rect x="150" y="174" width="80" height="8" rx="4" fill="var(--color-sky)" />
    <!-- Caret -->
    <rect x="238" y="174" width="8" height="10" fill="var(--color-ember)" class="anim-caret" />
  </g>

  <!-- Monitor 2 (Vertical/Tilted) -->
  <g transform="translate(390, 120) rotate(8)">
    <path d="M70 140 L60 100 H100 L90 140 Z" fill="var(--color-ink-soft)" stroke="var(--color-ink)" stroke-width="3" stroke-linejoin="round" />
    <rect x="50" y="136" width="60" height="4" rx="2" fill="var(--color-ink)" />
    <rect x="30" y="20" width="100" height="140" rx="6" fill="var(--color-ink)" stroke="var(--color-ink)" stroke-width="4" />
    <!-- Chart -->
    <rect x="40" y="120" width="16" height="30" rx="2" fill="var(--color-sage)" />
    <rect x="62" y="90" width="16" height="60" rx="2" fill="var(--color-sky)" />
    <rect x="84" y="60" width="16" height="90" rx="2" fill="var(--color-ember)" />
  </g>

  <!-- Keyboard -->
  <g transform="translate(180, 245) rotate(-2)">
    <rect x="0" y="0" width="160" height="40" rx="4" fill="var(--color-cream)" stroke="var(--color-ink)" stroke-width="3" />
    <rect x="10" y="10" width="20" height="20" rx="2" fill="var(--color-ink-soft)" />
    <rect x="35" y="10" width="20" height="20" rx="2" fill="var(--color-ink-soft)" />
    <rect x="60" y="10" width="20" height="20" rx="2" fill="var(--color-ember)" />
    <rect x="85" y="10" width="65" height="20" rx="2" fill="var(--color-ink-soft)" />
  </g>

  <!-- Lamp -->
  <g>
    <path d="M520 260 L540 160 L480 100" fill="none" stroke="var(--color-ink)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="520" cy="260" r="14" fill="var(--color-forest-deep)" stroke="var(--color-ink)" stroke-width="3" />
    <path d="M480 100 L440 130" stroke="var(--color-ink)" stroke-width="6" stroke-linecap="round" />
    <path d="M430 110 L470 150 L450 160 L410 120 Z" fill="var(--color-sage)" stroke="var(--color-ink)" stroke-width="3" stroke-linejoin="round" />
    <!-- Light cone -->
    <path d="M440 140 L300 260 L480 260 Z" fill="url(#lamp-glow)" class="anim-glow" style="mix-blend-mode: overlay;" />
  </g>

  <!-- Maker (The human) -->
  <g>
    <!-- Shoulders / Body -->
    <path d="M500 440 Q500 320 580 320 Q660 320 660 440 Z" fill="var(--color-forest)" stroke="var(--color-ink)" stroke-width="4" stroke-linejoin="round" />
    <!-- Head -->
    <circle cx="580" cy="280" r="45" fill="var(--color-ember-soft)" stroke="var(--color-ink)" stroke-width="4" />
    <!-- Hair -->
    <path d="M535 280 Q535 210 580 210 Q625 210 625 280 Q625 240 580 240 Q535 240 535 280 Z" fill="var(--color-ink)" stroke="var(--color-ink)" stroke-width="2" stroke-linejoin="round" />
    <!-- Glasses -->
    <rect x="540" y="260" width="30" height="20" rx="4" fill="none" stroke="var(--color-ink)" stroke-width="3" />
    <path d="M570 270 H625" stroke="var(--color-ink)" stroke-width="3" />
    <!-- Eye -->
    <g class="anim-blink">
      <circle cx="555" cy="270" r="3" fill="var(--color-ink)" />
    </g>
    <!-- Arm reaching out -->
    <path d="M520 340 Q460 360 420 310" fill="none" stroke="var(--color-forest)" stroke-width="24" stroke-linecap="round" />
    <path d="M520 340 Q460 360 420 310" fill="none" stroke="var(--color-ink)" stroke-width="32" stroke-linecap="round" style="opacity: 0.1;" />
    <path d="M420 310 Q400 290 380 280" fill="none" stroke="var(--color-ember-soft)" stroke-width="16" stroke-linecap="round" />
  </g>

  <!-- Floor Plant -->
  <g transform="translate(680, 360)">
    <path d="M0 80 Q-20 20 -40 10" fill="none" stroke="var(--color-sage)" stroke-width="8" stroke-linecap="round" />
    <path d="M0 80 Q10 30 20 0" fill="none" stroke="var(--color-sage)" stroke-width="8" stroke-linecap="round" />
    <path d="M0 80 Q-5 40 10 30" fill="none" stroke="var(--color-sage)" stroke-width="8" stroke-linecap="round" />
    <path d="M-40 10 Q-30 -10 -20 0 Z" fill="var(--color-forest-deep)" />
    <path d="M20 0 Q35 -5 30 15 Z" fill="var(--color-forest-deep)" />
    <rect x="-25" y="80" width="50" height="60" rx="8" fill="var(--color-cream)" stroke="var(--color-ink)" stroke-width="4" stroke-linejoin="round" />
  </g>

  <defs>
    <clipPath id="window-clip">
      <rect x="428" y="48" width="204" height="144" rx="4" />
    </clipPath>
    <linearGradient id="lamp-glow" x1="440" y1="140" x2="390" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--color-ember)" stop-opacity="0.4" />
      <stop offset="1" stop-color="var(--color-ember)" stop-opacity="0" />
    </linearGradient>
  </defs>
</svg>
